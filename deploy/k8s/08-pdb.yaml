apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: wallet-api-pdb
  namespace: wallet-demo
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: wallet-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  namespace: wallet-demo
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: redis
