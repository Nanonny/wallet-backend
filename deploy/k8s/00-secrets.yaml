apiVersion: v1
kind: Secret
metadata:
  name: wallet-demo-secrets
  namespace: wallet-demo
type: Opaque
stringData:
  # Demo defaults only. Replace these values with External Secrets, Sealed Secrets,
  # or SOPS-encrypted values before deploying outside a local development cluster.
  # JWT_SECRET must be a random string of at least 16 characters, e.g.:
  #   openssl rand -hex 32
  redis-password: wallet-demo-change-me
  grafana-admin-password: wallet-demo-change-me
  postgres-password: wallet-demo-change-me
  jwt-secret: change-me-0123456789abcdef-0123456789abcdef
