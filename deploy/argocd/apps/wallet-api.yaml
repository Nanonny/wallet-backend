apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wallet-api
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: wallet-devops-lab
spec:
  project: default
  source:
    repoURL: https://github.com/Nanonny/wallet-backend.git
    targetRevision: main
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: wallet-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
