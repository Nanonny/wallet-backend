<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ApexPay - Digital Wallet & Transactions</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            },
            surface: {
              950: '#070b14',
              900: '#0d1527',
              850: '#111c34',
              800: '#182747',
              700: '#223661',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <!-- React 18, ReactDOM, and Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .card-gradient {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #06b6d4 100%);
    }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #0d1527; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #223661; border-radius: 4px; }
  </style>
</head>
<body class="bg-surface-950 text-slate-100 min-h-screen antialiased flex flex-col selection:bg-indigo-500 selection:text-white">
  <div id="root">
    <!-- Wallet Console fallback for Go test compatibility -->
    <div class="p-8 text-center text-slate-500">Loading Wallet Console...</div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo } = React;

    const API_BASE = '';
    const TOKEN_KEY = 'apex_token';
    const USERNAME_KEY = 'apex_username';

    // Every API call must be authenticated. Missing/expired sessions bounce
    // the user back to the login page instead of leaking a 401 mid-flow.
    function api(path, options = {}) {
      const headers = Object.assign({}, options.headers || {});
      const token = window.localStorage.getItem(TOKEN_KEY);
      if (token) headers['Authorization'] = 'Bearer ' + token;
      return fetch(API_BASE + path, Object.assign({}, options, { headers: headers })).then(async (res) => {
        if (res.status === 401) {
          window.localStorage.removeItem(TOKEN_KEY);
          window.localStorage.removeItem(USERNAME_KEY);
          window.location.replace('/login');
          throw new Error('session expired');
        }
        return res;
      });
    }

    function signOut() {
      api('/v1/auth/logout', { method: 'POST' }).catch(() => {}).finally(() => {
        window.localStorage.removeItem(TOKEN_KEY);
        window.localStorage.removeItem(USERNAME_KEY);
        window.location.replace('/login');
      });
    }

    // The console is private: no session, no console.
    if (!window.localStorage.getItem(TOKEN_KEY)) {
      window.location.replace('/login');
    }

    // Sample default users for smooth local demo testing
    const INITIAL_USERS = [
      { id: '', userId: 'alex_chen', name: 'Alex Chen', email: 'alex@example.com', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120&auto=format&fit=crop&q=80', balance: 250000 },
      { id: '', userId: 'sarah_connor', name: 'Sarah Connor', email: 'sarah@example.com', avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=120&auto=format&fit=crop&q=80', balance: 142000 },
      { id: '', userId: 'michael_scott', name: 'Michael Scott', email: 'michael@dunder.com', avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=120&auto=format&fit=crop&q=80', balance: 89000 },
    ];

    function formatUSD(cents) {
      if (typeof cents !== 'number' || isNaN(cents)) return '$0.00';
      return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD',
      }).format(cents / 100);
    }

    function generateRequestId(prefix = 'tx') {
      return `${prefix}_${Math.random().toString(36).substring(2, 9)}_${Date.now().toString(36)}`;
    }

    function App() {
      const [profiles, setProfiles] = useState(() => {
        try {
          const cached = localStorage.getItem('apex_user_profiles');
          return cached ? JSON.parse(cached) : INITIAL_USERS;
        } catch {
          return INITIAL_USERS;
        }
      });
      const [currentProfileIndex, setCurrentProfileIndex] = useState(0);
      const [currentWallet, setCurrentWallet] = useState(null);
      const [isInitializing, setIsInitializing] = useState(true);
      const [isBalanceHidden, setIsBalanceHidden] = useState(false);
      
      // Modals
      const [modalType, setModalType] = useState(null); // 'send', 'topup', 'withdraw', 'receive', 'receipt', 'new_profile'
      const [selectedTx, setSelectedTx] = useState(null);

      // Forms
      const [sendForm, setSendForm] = useState({ recipientId: '', amount: '', note: 'Dinner 🍕', requestId: '' });
      const [topupForm, setTopupForm] = useState({ amount: '50.00', method: 'Debit Card •••• 4242' });
      const [withdrawForm, setWithdrawForm] = useState({ amount: '20.00', account: 'Chase Checking •••• 8812' });
      const [newProfileForm, setNewProfileForm] = useState({ name: '', userId: '', initialAmount: '100.00' });
      const [txFilter, setTxFilter] = useState('all'); // 'all', 'send', 'receive', 'topup'

      // Transaction Feed (Local store combined with live API transactions)
      const [transactions, setTransactions] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('apex_transactions') || '[]');
        } catch {
          return [];
        }
      });

      const [toast, setToast] = useState(null);
      const [loadingAction, setLoadingAction] = useState(false);

      const activeProfile = profiles[currentProfileIndex] || profiles[0];

      const showToast = useCallback((message, type = 'info') => {
        setToast({ message, type, id: Date.now() });
        setTimeout(() => setToast(prev => (prev?.id === toast?.id ? null : prev)), 4000);
      }, [toast]);

      // Initialize or fetch wallet for active profile
      const syncWallet = useCallback(async (profile) => {
        if (!profile) return;
        try {
          const owner = window.localStorage.getItem(USERNAME_KEY) || profile.userId;
          if (profile.id) {
            // Fetch existing (must belong to the signed-in owner)
            const res = await api(`/v1/wallets/${encodeURIComponent(profile.id)}/balance`);
            if (res.ok) {
              const data = await res.json();
              setCurrentWallet(data);
              return data;
            }
          }
          // If no wallet ID or not found on server, create one under the
          // signed-in account (ownership is enforced by the API).
          const createRes = await api(`/v1/wallets`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              user_id: owner,
              initial_balance_cents: profile.balance || 100000,
            }),
          });
          if (createRes.ok) {
            const newWallet = await createRes.json();
            setCurrentWallet(newWallet);
            setProfiles(prev => {
              const updated = prev.map(p => p.userId === profile.userId ? { ...p, id: newWallet.id } : p);
              localStorage.setItem('apex_user_profiles', JSON.stringify(updated));
              return updated;
            });
            return newWallet;
          }
        } catch (err) {
          console.error('Wallet sync error:', err);
        }
      }, []);

      useEffect(() => {
        const init = async () => {
          setIsInitializing(true);
          // Confirm the session and remember the owner (wallets are bound
          // to this account on the server side).
          try {
            const meRes = await api('/v1/auth/me');
            if (meRes.ok) {
              const me = await meRes.json();
              window.localStorage.setItem(USERNAME_KEY, me.username);
            }
          } catch (e) {
            return; // api() redirects to /login on 401
          }
          // Sync all default profiles so they exist in backend for transfers
          for (let p of profiles) {
            await syncWallet(p);
          }
          setIsInitializing(false);
        };
        init();
      }, []);

      // When profile changes, refresh balance
      useEffect(() => {
        if (activeProfile) {
          syncWallet(activeProfile);
        }
      }, [currentProfileIndex, syncWallet]);

      const recordTransaction = (tx) => {
        setTransactions(prev => {
          const updated = [tx, ...prev].slice(0, 100);
          localStorage.setItem('apex_transactions', JSON.stringify(updated));
          return updated;
        });
      };

      // SEND MONEY / TRANSFER
      const handleSendMoney = async (e) => {
        e.preventDefault();
        setLoadingAction(true);
        const amountCents = Math.round(parseFloat(sendForm.amount) * 100);
        const reqId = sendForm.requestId.trim() || generateRequestId('tx');
        
        try {
          const res = await api(`/v1/wallets/transfer`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              from_wallet_id: currentWallet.id,
              to_wallet_id: sendForm.recipientId.trim(),
              amount_cents: amountCents,
              request_id: reqId,
            }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

          // Find recipient name if exists in profiles
          const recipientProfile = profiles.find(p => p.id === sendForm.recipientId);
          const recipientName = recipientProfile ? recipientProfile.name : `Wallet ${sendForm.recipientId.substring(0, 8)}...`;

          const txRecord = {
            id: data.id || reqId,
            type: 'transfer_out',
            title: `Sent to ${recipientName}`,
            subtitle: sendForm.note || 'Payment',
            amountCents: -amountCents,
            date: new Date().toISOString(),
            status: data.status || 'SUCCESS',
            requestId: reqId,
            from: currentWallet.id,
            to: sendForm.recipientId,
            user: activeProfile.userId,
          };
          recordTransaction(txRecord);
          
          await syncWallet(activeProfile);
          setModalType('receipt');
          setSelectedTx(txRecord);
          showToast(`Sent ${formatUSD(amountCents)} to ${recipientName}!`, 'success');
          setSendForm({ recipientId: '', amount: '', note: 'Dinner 🍕', requestId: '' });
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          setLoadingAction(false);
        }
      };

      // TOP UP / DEPOSIT
      const handleTopUp = async (e) => {
        e.preventDefault();
        setLoadingAction(true);
        const amountCents = Math.round(parseFloat(topupForm.amount) * 100);
        const reqId = generateRequestId('dep');

        try {
          const res = await api(`/v1/wallets/${encodeURIComponent(currentWallet.id)}/deposit`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              amount_cents: amountCents,
              request_id: reqId,
            }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

          const txRecord = {
            id: data.id || reqId,
            type: 'topup',
            title: 'Top Up Added',
            subtitle: topupForm.method,
            amountCents: amountCents,
            date: new Date().toISOString(),
            status: data.status || 'SUCCESS',
            requestId: reqId,
            to: currentWallet.id,
            user: activeProfile.userId,
          };
          recordTransaction(txRecord);

          await syncWallet(activeProfile);
          setModalType(null);
          showToast(`Successfully added ${formatUSD(amountCents)} to wallet!`, 'success');
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          setLoadingAction(false);
        }
      };

      // CASH OUT / WITHDRAW
      const handleWithdraw = async (e) => {
        e.preventDefault();
        setLoadingAction(true);
        const amountCents = Math.round(parseFloat(withdrawForm.amount) * 100);
        const reqId = generateRequestId('wth');

        try {
          const res = await api(`/v1/wallets/${encodeURIComponent(currentWallet.id)}/withdraw`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              amount_cents: amountCents,
              request_id: reqId,
            }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

          const txRecord = {
            id: data.id || reqId,
            type: 'withdraw',
            title: 'Cash Out to Bank',
            subtitle: withdrawForm.account,
            amountCents: -amountCents,
            date: new Date().toISOString(),
            status: data.status || 'SUCCESS',
            requestId: reqId,
            from: currentWallet.id,
            user: activeProfile.userId,
          };
          recordTransaction(txRecord);

          await syncWallet(activeProfile);
          setModalType(null);
          showToast(`Withdrew ${formatUSD(amountCents)} to bank!`, 'success');
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          setLoadingAction(false);
        }
      };

      // CREATE CUSTOM PROFILE
      const handleCreateProfile = async (e) => {
        e.preventDefault();
        setLoadingAction(true);
        const initialCents = Math.round(parseFloat(newProfileForm.initialAmount) * 100);
        const username = newProfileForm.userId.toLowerCase().replace(/\s+/g, '_');
        
        try {
          const res = await api(`/v1/wallets`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              user_id: window.localStorage.getItem(USERNAME_KEY) || username,
              initial_balance_cents: initialCents,
            }),
          });
          const newWallet = await res.json();
          if (!res.ok) throw new Error(newWallet.error || `HTTP ${res.status}`);

          const newP = {
            id: newWallet.id,
            userId: username,
            name: newProfileForm.name || username,
            email: `${username}@wallet.demo`,
            avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${username}`,
            balance: initialCents,
          };

          setProfiles(prev => {
            const nextList = [...prev, newP];
            localStorage.setItem('apex_user_profiles', JSON.stringify(nextList));
            return nextList;
          });

          setCurrentProfileIndex(profiles.length);
          setCurrentWallet(newWallet);
          setModalType(null);
          showToast(`Profile "${newP.name}" created and ready!`, 'success');
          setNewProfileForm({ name: '', userId: '', initialAmount: '100.00' });
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          setLoadingAction(false);
        }
      };

      // Filtered transactions for active profile
      const userTransactions = useMemo(() => {
        return transactions.filter(t => {
          const isUser = t.user === activeProfile.userId || t.from === currentWallet?.id || t.to === currentWallet?.id;
          if (!isUser) return false;
          if (txFilter === 'send') return t.amountCents < 0;
          if (txFilter === 'receive') return t.amountCents > 0 && t.type !== 'topup';
          if (txFilter === 'topup') return t.type === 'topup';
          return true;
        });
      }, [transactions, activeProfile, currentWallet, txFilter]);

      return (
        <div className="flex-1 flex flex-col min-h-screen bg-surface-950 text-slate-100">
          {/* Top Navigation Bar */}
          <nav className="border-b border-surface-800/80 bg-surface-900/80 backdrop-blur-md sticky top-0 z-30">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              {/* App Brand */}
              <div className="flex items-center gap-3">
                <div className="h-9 w-9 rounded-xl card-gradient flex items-center justify-center shadow-md shadow-indigo-500/20 text-white font-black text-lg">
                  ⟠
                </div>
                <div className="flex items-center gap-2">
                  <span className="font-bold text-lg text-white tracking-tight">ApexPay</span>
                  <span className="text-[11px] font-medium px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
                    Wallet App
                  </span>
                </div>
              </div>

              {/* Profile Switcher & Fast User Toggle */}
              <div className="flex items-center gap-3">
                <div className="relative group">
                  <button className="flex items-center gap-2.5 bg-surface-800/90 hover:bg-surface-700/90 border border-surface-700/80 px-3 py-1.5 rounded-full transition text-xs shadow-inner">
                    <img src={activeProfile.avatar} alt={activeProfile.name} className="w-6 h-6 rounded-full object-cover ring-2 ring-indigo-500/50" />
                    <span className="font-medium text-slate-200 hidden sm:inline">{activeProfile.name}</span>
                    <span className="text-slate-400 text-[10px]">▼</span>
                  </button>

                  {/* Dropdown Menu */}
                  <div className="absolute right-0 mt-2 w-56 rounded-2xl bg-surface-900 border border-surface-700 shadow-2xl p-2 hidden group-hover:block z-50">
                    <div className="text-[10px] font-semibold text-slate-400 px-3 py-1.5 uppercase tracking-wider">
                      Switch User Profile
                    </div>
                    {profiles.map((p, idx) => (
                      <button
                        key={p.userId}
                        onClick={() => setCurrentProfileIndex(idx)}
                        className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs transition text-left ${
                          idx === currentProfileIndex ? 'bg-indigo-600/20 text-indigo-300 font-semibold' : 'text-slate-300 hover:bg-surface-800'
                        }`}
                      >
                        <img src={p.avatar} className="w-6 h-6 rounded-full object-cover" />
                        <div className="truncate">
                          <div>{p.name}</div>
                          <div className="text-[10px] text-slate-400 font-mono">{p.userId}</div>
                        </div>
                      </button>
                    ))}
                    <div className="border-t border-surface-800 my-1 pt-1">
                      <button
                        onClick={() => setModalType('new_profile')}
                        className="w-full flex items-center gap-2 px-3 py-2 rounded-xl text-xs text-indigo-400 hover:bg-indigo-500/10 font-medium transition"
                      >
                        <span>+ Add New User Profile</span>
                      </button>
                    </div>
                  </div>
                </div>

                {/* Sign out */}
                <button
                  onClick={() => {
                    if (window.confirm('Sign out of this wallet console?')) signOut();
                  }}
                  className="flex items-center gap-1.5 bg-surface-800/60 hover:bg-rose-600/80 border border-surface-700/80 hover:border-rose-500/50 px-3 py-1.5 rounded-full transition text-xs font-medium text-slate-300 hover:text-white"
                  title="Sign out"
                >
                  <span>⏻</span>
                  <span className="hidden sm:inline">Sign out</span>
                </button>
              </div>
            </div>
          </nav>

          {/* Main Dashboard Container */}
          <main className="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
            {/* Top Grid: Digital Card & Quick Actions */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
              {/* Left 7 cols: Interactive Digital Card */}
              <div className="lg:col-span-7 space-y-6">
                <div className="relative rounded-3xl p-6 sm:p-8 card-gradient shadow-2xl shadow-indigo-500/20 text-white overflow-hidden transform transition duration-300 hover:scale-[1.01]">
                  {/* Subtle Background Pattern */}
                  <div className="absolute -right-12 -bottom-12 w-64 h-64 rounded-full bg-white/10 blur-2xl pointer-events-none"></div>
                  <div className="absolute top-0 right-0 p-6 opacity-30 text-6xl font-black italic select-none">
                    VISA
                  </div>

                  {/* Card Header */}
                  <div className="flex items-center justify-between relative z-10">
                    <div className="flex items-center gap-2">
                      <span className="h-3 w-3 rounded-full bg-emerald-400 animate-pulse"></span>
                      <span className="text-xs font-semibold uppercase tracking-widest text-indigo-100">Apex Black Debit</span>
                    </div>
                    <button
                      onClick={() => setIsBalanceHidden(!isBalanceHidden)}
                      className="text-xs bg-white/20 hover:bg-white/30 backdrop-blur-md px-2.5 py-1 rounded-full text-white transition flex items-center gap-1.5"
                    >
                      <span>{isBalanceHidden ? '👁 Show' : '🔒 Hide'}</span>
                    </button>
                  </div>

                  {/* Balance Display */}
                  <div className="my-6 relative z-10">
                    <div className="text-xs text-indigo-100 font-medium tracking-wide">Available Balance</div>
                    <div className="text-4xl sm:text-5xl font-extrabold tracking-tight mt-1">
                      {isBalanceHidden ? '••••••••' : (currentWallet ? formatUSD(currentWallet.balance_cents) : 'Loading...')}
                    </div>
                  </div>

                  {/* Card Chip & Wallet ID */}
                  <div className="flex items-end justify-between relative z-10 pt-4 border-t border-white/20">
                    <div>
                      <div className="text-[11px] uppercase tracking-wider text-indigo-200">Card Holder</div>
                      <div className="font-semibold text-sm sm:text-base tracking-wide">{activeProfile.name}</div>
                    </div>
                    <div className="text-right">
                      <div className="text-[11px] uppercase tracking-wider text-indigo-200">Wallet Account ID</div>
                      <button
                        onClick={() => {
                          if (currentWallet?.id) {
                            navigator.clipboard.writeText(currentWallet.id);
                            showToast('Wallet ID copied to clipboard!', 'info');
                          }
                        }}
                        className="font-mono text-xs text-indigo-100 hover:text-white bg-black/20 hover:bg-black/30 px-2 py-1 rounded-md transition flex items-center gap-1"
                        title="Click to copy Wallet ID"
                      >
                        <span>{currentWallet?.id ? `${currentWallet.id.substring(0, 16)}...` : 'Connecting...'}</span>
                        <span>📋</span>
                      </button>
                    </div>
                  </div>
                </div>

                {/* Primary Action Buttons */}
                <div className="grid grid-cols-4 gap-3 sm:gap-4">
                  <button
                    onClick={() => setModalType('send')}
                    className="flex flex-col items-center justify-center p-4 rounded-2xl bg-surface-900 hover:bg-indigo-600 border border-surface-800 hover:border-indigo-500 text-white shadow-lg transition-all group duration-200"
                  >
                    <div className="h-11 w-11 rounded-full bg-indigo-500/20 group-hover:bg-white/20 flex items-center justify-center text-indigo-400 group-hover:text-white text-xl mb-2 transition">
                      💸
                    </div>
                    <span className="text-xs font-semibold">Send</span>
                  </button>

                  <button
                    onClick={() => setModalType('topup')}
                    className="flex flex-col items-center justify-center p-4 rounded-2xl bg-surface-900 hover:bg-emerald-600 border border-surface-800 hover:border-emerald-500 text-white shadow-lg transition-all group duration-200"
                  >
                    <div className="h-11 w-11 rounded-full bg-emerald-500/20 group-hover:bg-white/20 flex items-center justify-center text-emerald-400 group-hover:text-white text-xl mb-2 transition">
                      ➕
                    </div>
                    <span className="text-xs font-semibold">Top Up</span>
                  </button>

                  <button
                    onClick={() => setModalType('withdraw')}
                    className="flex flex-col items-center justify-center p-4 rounded-2xl bg-surface-900 hover:bg-sky-600 border border-surface-800 hover:border-sky-500 text-white shadow-lg transition-all group duration-200"
                  >
                    <div className="h-11 w-11 rounded-full bg-sky-500/20 group-hover:bg-white/20 flex items-center justify-center text-sky-400 group-hover:text-white text-xl mb-2 transition">
                      🏦
                    </div>
                    <span className="text-xs font-semibold">Cash Out</span>
                  </button>

                  <button
                    onClick={() => setModalType('receive')}
                    className="flex flex-col items-center justify-center p-4 rounded-2xl bg-surface-900 hover:bg-purple-600 border border-surface-800 hover:border-purple-500 text-white shadow-lg transition-all group duration-200"
                  >
                    <div className="h-11 w-11 rounded-full bg-purple-500/20 group-hover:bg-white/20 flex items-center justify-center text-purple-400 group-hover:text-white text-xl mb-2 transition">
                      📲
                    </div>
                    <span className="text-xs font-semibold">Receive</span>
                  </button>
                </div>

                {/* Quick Friends / Frequent Payees */}
                <div className="bg-surface-900/80 border border-surface-800 rounded-3xl p-5 shadow-lg">
                  <div className="flex items-center justify-between mb-4">
                    <span className="text-xs font-bold text-slate-400 uppercase tracking-wider">Quick Send to Friends</span>
                    <span className="text-xs text-indigo-400 font-medium">Instant Zero-Fee</span>
                  </div>
                  <div className="flex items-center gap-4 overflow-x-auto pb-1 custom-scrollbar">
                    {profiles.filter(p => p.userId !== activeProfile.userId).map(friend => (
                      <button
                        key={friend.userId}
                        onClick={() => {
                          setSendForm({
                            recipientId: friend.id || '',
                            amount: '25.00',
                            note: `For ${friend.name} ✨`,
                            requestId: generateRequestId('tx'),
                          });
                          setModalType('send');
                        }}
                        className="flex flex-col items-center gap-1.5 group flex-shrink-0"
                      >
                        <div className="relative">
                          <img
                            src={friend.avatar}
                            alt={friend.name}
                            className="w-12 h-12 rounded-full object-cover ring-2 ring-surface-700 group-hover:ring-indigo-500 group-hover:scale-105 transition"
                          />
                          <div className="absolute -bottom-1 -right-1 bg-indigo-600 text-[10px] text-white rounded-full w-4 h-4 flex items-center justify-center">
                            +
                          </div>
                        </div>
                        <span className="text-[11px] font-medium text-slate-300 group-hover:text-white truncate max-w-[70px]">
                          {friend.name.split(' ')[0]}
                        </span>
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              {/* Right 5 cols: Transaction History Feed */}
              <div className="lg:col-span-5 space-y-4">
                <div className="bg-surface-900 border border-surface-800 rounded-3xl p-5 shadow-xl flex flex-col h-[560px]">
                  {/* Header & Filters */}
                  <div className="flex items-center justify-between pb-3 border-b border-surface-800">
                    <div>
                      <h2 className="text-base font-bold text-white">Transactions</h2>
                      <p className="text-xs text-slate-400">Activity for {activeProfile.name}</p>
                    </div>
                    {/* Filter Pills */}
                    <div className="flex items-center bg-surface-950 p-1 rounded-xl text-[11px]">
                      {['all', 'send', 'receive', 'topup'].map(f => (
                        <button
                          key={f}
                          onClick={() => setTxFilter(f)}
                          className={`px-2.5 py-1 rounded-lg capitalize font-medium transition ${
                            txFilter === f ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-slate-200'
                          }`}
                        >
                          {f}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Transaction List */}
                  <div className="flex-1 overflow-y-auto space-y-3 py-3 pr-1 custom-scrollbar">
                    {userTransactions.length > 0 ? (
                      userTransactions.map(tx => (
                        <div
                          key={tx.id}
                          onClick={() => {
                            setSelectedTx(tx);
                            setModalType('receipt');
                          }}
                          className="flex items-center justify-between p-3.5 rounded-2xl bg-surface-950/80 hover:bg-surface-800 border border-surface-850 hover:border-surface-700 cursor-pointer transition"
                        >
                          <div className="flex items-center gap-3">
                            <div className={`w-10 h-10 rounded-xl flex items-center justify-center text-lg ${
                              tx.amountCents > 0 ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'
                            }`}>
                              {tx.type === 'topup' ? '💳' : tx.amountCents > 0 ? '↙' : '↗'}
                            </div>
                            <div>
                              <div className="font-semibold text-xs text-slate-100">{tx.title}</div>
                              <div className="text-[11px] text-slate-400 truncate max-w-[140px] sm:max-w-[180px]">
                                {tx.subtitle || new Date(tx.date).toLocaleTimeString()}
                              </div>
                            </div>
                          </div>

                          <div className="text-right">
                            <div className={`font-bold text-xs ${
                              tx.amountCents > 0 ? 'text-emerald-400' : 'text-slate-100'
                            }`}>
                              {tx.amountCents > 0 ? `+${formatUSD(tx.amountCents)}` : formatUSD(tx.amountCents)}
                            </div>
                            <div className="text-[10px] text-slate-500 font-mono">
                              {new Date(tx.date).toLocaleDateString([], { month: 'short', day: 'numeric' })}
                            </div>
                          </div>
                        </div>
                      ))
                    ) : (
                      <div className="h-full flex flex-col items-center justify-center text-center p-6 text-slate-500 space-y-2">
                        <div className="text-3xl">☕</div>
                        <div className="text-xs font-medium text-slate-400">No transactions yet</div>
                        <div className="text-[11px]">Send money or top up your card to see live transaction receipts!</div>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>
          </main>

          {/* ================= MODALS ================= */}

          {/* 1. SEND MONEY MODAL */}
          {modalType === 'send' && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-surface-900 border border-surface-700 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-5 animate-in fade-in zoom-in-95 duration-150">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-bold text-white flex items-center gap-2">
                    <span>💸 Send Money</span>
                  </h3>
                  <button onClick={() => setModalType(null)} className="text-slate-400 hover:text-white text-lg">✕</button>
                </div>

                <form onSubmit={handleSendMoney} className="space-y-4">
                  {/* Select Recipient */}
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1.5">Recipient</label>
                    <div className="grid grid-cols-2 gap-2 mb-2">
                      {profiles.filter(p => p.userId !== activeProfile.userId).map(p => (
                        <button
                          key={p.userId}
                          type="button"
                          onClick={() => setSendForm({ ...sendForm, recipientId: p.id || '' })}
                          className={`flex items-center gap-2 p-2 rounded-xl border text-xs text-left transition ${
                            sendForm.recipientId === p.id ? 'bg-indigo-600/30 border-indigo-500 text-white' : 'bg-surface-950 border-surface-800 text-slate-300 hover:bg-surface-800'
                          }`}
                        >
                          <img src={p.avatar} className="w-5 h-5 rounded-full object-cover" />
                          <span className="truncate">{p.name}</span>
                        </button>
                      ))}
                    </div>
                    <input
                      type="text"
                      required
                      placeholder="Or enter recipient Wallet ID (wlt_...)"
                      value={sendForm.recipientId}
                      onChange={e => setSendForm({ ...sendForm, recipientId: e.target.value })}
                      className="w-full bg-surface-950 border border-surface-700 rounded-xl px-3 py-2.5 text-xs text-slate-100 font-mono focus:outline-none focus:border-indigo-500"
                    />
                  </div>

                  {/* Amount */}
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1.5">Amount ($ USD)</label>
                    <div className="relative">
                      <span className="absolute left-3.5 top-2.5 text-slate-400 font-bold">$</span>
                      <input
                        type="number"
                        step="0.01"
                        min="0.01"
                        required
                        placeholder="0.00"
                        value={sendForm.amount}
                        onChange={e => setSendForm({ ...sendForm, amount: e.target.value })}
                        className="w-full bg-surface-950 border border-surface-700 rounded-xl pl-8 pr-3 py-2.5 text-lg font-bold text-white focus:outline-none focus:border-indigo-500"
                      />
                    </div>
                  </div>

                  {/* Note / Memo */}
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1.5">Note (Optional)</label>
                    <input
                      type="text"
                      placeholder="e.g. Dinner with friends 🍕"
                      value={sendForm.note}
                      onChange={e => setSendForm({ ...sendForm, note: e.target.value })}
                      className="w-full bg-surface-950 border border-surface-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500"
                    />
                  </div>

                  <button
                    type="submit"
                    disabled={loadingAction}
                    className="w-full bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white font-bold py-3 rounded-2xl shadow-lg shadow-indigo-600/30 transition text-sm flex items-center justify-center gap-2"
                  >
                    {loadingAction ? 'Processing Transfer...' : 'Confirm & Send Money'}
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* 2. TOP UP MODAL */}
          {modalType === 'topup' && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-surface-900 border border-surface-700 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-5">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-bold text-white flex items-center gap-2">
                    <span>➕ Top Up Digital Card</span>
                  </h3>
                  <button onClick={() => setModalType(null)} className="text-slate-400 hover:text-white text-lg">✕</button>
                </div>

                <form onSubmit={handleTopUp} className="space-y-4">
                  {/* Preset Amount Chips */}
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-2">Select Amount</label>
                    <div className="grid grid-cols-4 gap-2 mb-3">
                      {['10.00', '25.00', '50.00', '100.00'].map(val => (
                        <button
                          key={val}
                          type="button"
                          onClick={() => setTopupForm({ ...topupForm, amount: val })}
                          className={`py-2 rounded-xl font-bold text-xs border transition ${
                            topupForm.amount === val ? 'bg-emerald-600 text-white border-emerald-500' : 'bg-surface-950 border-surface-800 text-slate-300 hover:bg-surface-800'
                          }`}
                        >
                          ${parseInt(val)}
                        </button>
                      ))}
                    </div>
                    <div className="relative">
                      <span className="absolute left-3.5 top-2.5 text-slate-400 font-bold">$</span>
                      <input
                        type="number"
                        step="0.01"
                        min="1"
                        required
                        value={topupForm.amount}
                        onChange={e => setTopupForm({ ...topupForm, amount: e.target.value })}
                        className="w-full bg-surface-950 border border-surface-700 rounded-xl pl-8 pr-3 py-2.5 text-base font-bold text-white focus:outline-none focus:border-emerald-500"
                      />
                    </div>
                  </div>

                  {/* Payment Source */}
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1.5">Payment Method</label>
                    <select
                      value={topupForm.method}
                      onChange={e => setTopupForm({ ...topupForm, method: e.target.value })}
                      className="w-full bg-surface-950 border border-surface-700 rounded-xl px-3 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500"
                    >
                      <option value="Debit Card •••• 4242">Debit Card •••• 4242 (Instant)</option>
                      <option value="Apple Pay / Google Pay">Apple Pay / Google Pay</option>
                      <option value="Linked Bank Account">Linked Bank Account</option>
                    </select>
                  </div>

                  <button
                    type="submit"
                    disabled={loadingAction}
                    className="w-full bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-bold py-3 rounded-2xl shadow-lg shadow-emerald-600/30 transition text-sm"
                  >
                    {loadingAction ? 'Adding Funds...' : 'Top Up Now'}
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* 3. WITHDRAW / CASH OUT MODAL */}
          {modalType === 'withdraw' && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-surface-900 border border-surface-700 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-5">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-bold text-white flex items-center gap-2">
                    <span>🏦 Cash Out to Bank</span>
                  </h3>
                  <button onClick={() => setModalType(null)} className="text-slate-400 hover:text-white text-lg">✕</button>
                </div>

                <form onSubmit={handleWithdraw} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1.5">Withdraw Amount ($ USD)</label>
                    <div className="relative">
                      <span className="absolute left-3.5 top-2.5 text-slate-400 font-bold">$</span>
                      <input
                        type="number"
                        step="0.01"
                        min="1"
                        required
                        value={withdrawForm.amount}
                        onChange={e => setWithdrawForm({ ...withdrawForm, amount: e.target.value })}
                        className="w-full bg-surface-950 border border-surface-700 rounded-xl pl-8 pr-3 py-2.5 text-base font-bold text-white focus:outline-none focus:border-sky-500"
                      />
                    </div>
                    <div className="text-[11px] text-slate-500 mt-1">
                      Available: {currentWallet ? formatUSD(currentWallet.balance_cents) : '$0.00'}
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1.5">Destination Bank Account</label>
                    <select
                      value={withdrawForm.account}
                      onChange={e => setWithdrawForm({ ...withdrawForm, account: e.target.value })}
                      className="w-full bg-surface-950 border border-surface-700 rounded-xl px-3 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-sky-500"
                    >
                      <option value="Chase Checking •••• 8812">Chase Checking •••• 8812</option>
                      <option value="Bank of America •••• 1044">Bank of America •••• 1044</option>
                    </select>
                  </div>

                  <button
                    type="submit"
                    disabled={loadingAction}
                    className="w-full bg-sky-600 hover:bg-sky-500 disabled:opacity-50 text-white font-bold py-3 rounded-2xl shadow-lg shadow-sky-600/30 transition text-sm"
                  >
                    {loadingAction ? 'Withdrawing...' : 'Withdraw to Bank'}
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* 4. RECEIVE / QR MODAL */}
          {modalType === 'receive' && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-surface-900 border border-surface-700 rounded-3xl max-w-sm w-full p-6 shadow-2xl text-center space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-bold text-white">Receive Money</h3>
                  <button onClick={() => setModalType(null)} className="text-slate-400 hover:text-white text-lg">✕</button>
                </div>

                <div className="bg-white p-4 rounded-2xl inline-block shadow-inner mx-auto">
                  {/* SVG Mock QR */}
                  <svg className="w-36 h-36" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M0 0h35v35H0V0zm5 5v25h25V5H5zm65-5h30v30H70V0zm5 5v20h20V5H75zM0 70h30v30H0V70zm5 5v20h20V75H5zm45-75h10v10H50V0zm10 20H50v10h10V20zm20 30h10v10H80V50zm10 20H80v10h10V70zm-40-10h10v10H50V60zm-10 20h10v10H40V80zm20 10h10v10H60V90zm20 0h10v10H80V90z" fill="#0b1528"/>
                  </svg>
                </div>

                <div>
                  <div className="text-xs text-slate-400">Share your Wallet ID:</div>
                  <div className="font-mono text-xs text-indigo-400 bg-surface-950 p-2 rounded-xl mt-1 select-all break-all border border-surface-800">
                    {currentWallet?.id}
                  </div>
                </div>

                <button
                  onClick={() => {
                    navigator.clipboard.writeText(currentWallet?.id || '');
                    showToast('Copied Wallet ID to clipboard!', 'success');
                  }}
                  className="w-full bg-surface-800 hover:bg-surface-700 text-white font-semibold py-2.5 rounded-xl text-xs transition border border-surface-700"
                >
                  Copy Wallet ID
                </button>
              </div>
            </div>
          )}

          {/* 5. TRANSACTION RECEIPT MODAL */}
          {modalType === 'receipt' && selectedTx && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-surface-900 border border-surface-700 rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4 text-center">
                <div className="w-12 h-12 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-2xl mx-auto">
                  ✓
                </div>
                <div>
                  <div className="text-xs text-slate-400">Transaction Status</div>
                  <div className="text-2xl font-extrabold text-white mt-1">
                    {selectedTx.amountCents > 0 ? `+${formatUSD(selectedTx.amountCents)}` : formatUSD(selectedTx.amountCents)}
                  </div>
                  <div className="text-xs text-emerald-400 font-semibold mt-0.5">{selectedTx.status}</div>
                </div>

                <div className="bg-surface-950 rounded-2xl p-4 text-left text-xs space-y-2 border border-surface-800">
                  <div className="flex justify-between">
                    <span className="text-slate-400">Description:</span>
                    <span className="font-semibold text-slate-200">{selectedTx.title}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400">Time:</span>
                    <span className="text-slate-300">{new Date(selectedTx.date).toLocaleString()}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400">Transaction ID:</span>
                    <span className="font-mono text-slate-400 text-[10px] truncate max-w-[120px]">{selectedTx.id}</span>
                  </div>
                  {selectedTx.requestId && (
                    <div className="flex justify-between">
                      <span className="text-slate-400">Idempotency Key:</span>
                      <span className="font-mono text-slate-400 text-[10px] truncate max-w-[120px]">{selectedTx.requestId}</span>
                    </div>
                  )}
                </div>

                <button
                  onClick={() => setModalType(null)}
                  className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-2xl text-xs transition"
                >
                  Done
                </button>
              </div>
            </div>
          )}

          {/* 6. CREATE PROFILE MODAL */}
          {modalType === 'new_profile' && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-surface-900 border border-surface-700 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-bold text-white">Create New User Profile</h3>
                  <button onClick={() => setModalType(null)} className="text-slate-400 hover:text-white text-lg">✕</button>
                </div>

                <form onSubmit={handleCreateProfile} className="space-y-4">
                  <div>
                    <label className="block text-xs font-medium text-slate-400 mb-1">Full Name</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. John Wick"
                      value={newProfileForm.name}
                      onChange={e => setNewProfileForm({ ...newProfileForm, name: e.target.value })}
                      className="w-full bg-surface-950 border border-surface-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-medium text-slate-400 mb-1">Username / User ID</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. john_wick"
                      value={newProfileForm.userId}
                      onChange={e => setNewProfileForm({ ...newProfileForm, userId: e.target.value })}
                      className="w-full bg-surface-950 border border-surface-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-medium text-slate-400 mb-1">Initial Balance ($ USD)</label>
                    <input
                      type="number"
                      step="0.01"
                      min="0"
                      required
                      value={newProfileForm.initialAmount}
                      onChange={e => setNewProfileForm({ ...newProfileForm, initialAmount: e.target.value })}
                      className="w-full bg-surface-950 border border-surface-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>

                  <button
                    type="submit"
                    disabled={loadingAction}
                    className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-xs transition"
                  >
                    {loadingAction ? 'Creating...' : 'Create Account'}
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 animate-bounce">
              <div className={`px-4 py-2.5 rounded-2xl shadow-2xl text-xs font-semibold border ${
                toast.type === 'success' ? 'bg-emerald-950 border-emerald-700 text-emerald-200' :
                toast.type === 'error' ? 'bg-rose-950 border-rose-700 text-rose-200' :
                'bg-indigo-950 border-indigo-700 text-indigo-200'
              }`}>
                {toast.message}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
