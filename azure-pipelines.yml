# Azure Pipelines — CI/CD for wallet-devops-lab
#
# Flow:  CI (gofmt, tidy, vet, race tests, docker build check)
#      -> CD (Azure SP login, build, push to ACR, deploy directly to AKS —
#         "lab mode" direct deploy, no Argo CD on AKS).
#
# Required in Azure DevOps (project settings):
#   1. ARM service connection named:  wallet-azure
#      (Authentication method: Service principal, role: Contributor on the
#       target subscription — ADO can create the SP for you in the wizard)
#   2. Variable group (Pipelines -> Libraries) named:  wallet-azure-vars
#        ACR_NAME               walletlab
#        ACR_LOGIN_SERVER       walletlab.azurecr.io
#        AKS_NAME               wallet-aks
#        RG                     wallet-lab-rg
#        TFARM_CLIENT_ID        <same SP client id>
#        TFARM_TENANT_ID        <tenant id>
#        TFARM_SUB_ID           <subscription id>
#        TFARM_CLIENT_SECRET    <client secret — marked SECRET in ADO>
#
# Secrets: none stored in this repo — auth flows through the ARM service
# connection's Service Principal.

trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: ci
    displayName: "CI - test & verify"
    jobs:
      - job: test
        services:
          redis:
            image: redis:7-alpine
            ports:
              - "6379:6379"
        steps:
          - script: |
              set -eu
              wget -qO /tmp/go.tgz "https://go.dev/dl/go1.26.6.linux-amd64.tar.gz"
              sudo tar -C /usr/local -xzf /tmp/go.tgz
              export PATH=/usr/local/go/bin:$PATH
              go version
            displayName: "Install Go 1.26.6"

          - script: |
              set -eu
              export PATH=/usr/local/go/bin:$PATH
              go mod download
            displayName: "Download Go modules"

          - script: |
              set -eu
              export PATH=/usr/local/go/bin:$PATH
              unformatted="$(gofmt -l .)"
              if [ -n "$unformatted" ]; then
                echo "##[error]These files need gofmt:"
                echo "$unformatted"
                exit 1
              fi
            displayName: "Check gofmt"

          - script: |
              set -eu
              export PATH=/usr/local/go/bin:$PATH
              go mod tidy
              git diff --exit-code go.mod go.sum
            displayName: "Verify go.mod/go.sum tidy"

          - script: |
              set -eu
              export PATH=/usr/local/go/bin:$PATH
              go vet ./...
            displayName: "go vet"

          - script: |
              set -eu
              export PATH=/usr/local/go/bin:$PATH
              REDIS_TEST_ADDR=localhost:6379 go test -race ./...
            displayName: "go test -race (redis service)"

          - script: |
              set -eu
              docker build -t wallet-api:ci .
            displayName: "Validate Docker build"

  - stage: infra
    displayName: "Infra - Terraform (RG + ACR + AKS)"
    jobs:
      - job: provision
        variables:
          - group: wallet-azure-vars
        steps:
          # NOTE: uses plain `az login` + `terraform` CLI (both pre-installed on
          # ADO-hosted ubuntu-latest) instead of the third-party `Terraform@0`
          # marketplace task, which is not present in every ADO org.
          # SP credentials come from the `wallet-azure-vars` group
          # (TFARM_CLIENT_ID / TFARM_CLIENT_SECRET / TFARM_TENANT_ID /
          #  TFARM_SUB_ID — the same SP as the `wallet-azure` service connection).
          # Idempotency: ADO hosted agents are stateless (no Terraform state),
          # so if the resource group already exists we skip apply.
          - script: |
              set -eu
              # --- fast-fail with a clear message if the SP variables are missing/empty
              [ -n "$(TFARM_CLIENT_ID)" ]        || { echo "##[error]TFARM_CLIENT_ID is empty — add it to wallet-azure-vars"; exit 1; }
              [ -n "$(TFARM_CLIENT_SECRET)" ]    || { echo "##[error]TFARM_CLIENT_SECRET is empty — add to wallet-azure-vars and tick SECRET in ADO"; exit 1; }
              [ -n "$(TFARM_TENANT_ID)" ]        || { echo "##[error]TFARM_TENANT_ID is empty — must be the tenant UUID (Directory (tenant) ID), not 'common'/'organizations'/'v2.0'"; exit 1; }
              [ -n "$(TFARM_SUB_ID)" ]           || { echo "##[error]TFARM_SUB_ID is empty"; exit 1; }
              case "$(TFARM_TENANT_ID)" in
                *-*) : ;;  # looks UUID-ish
                *)   echo "##[error]TFARM_TENANT_ID does not look like a UUID: $(TFARM_TENANT_ID)"; exit 1 ;;
              esac
              echo ">> SP login (azurerm creds for Terraform)"
              az login --service-principal \
                -u "$(TFARM_CLIENT_ID)" \
                -p "$(TFARM_CLIENT_SECRET)" \
                --tenant "$(TFARM_TENANT_ID)"

              # Ensure the required resource providers are registered on this
              # subscription (MissingSubscriptionRegistration happens on some
              # fresh/consumer subscriptions). Registration is async — poll.
              reg_provider() {
                local p="$1" s
                s="$(az provider show -n "$p" --query registrationState -o tsv 2>/dev/null || echo Unknown)"
                if [ "$s" != "Registered" ]; then
                  echo "   provider $p is '$s' -> registering"
                  az provider register -n "$p" || echo "   register returned non-zero (may still be in progress)"
                fi
              }
              reg_provider Microsoft.ContainerRegistry
              reg_provider Microsoft.ContainerService
              ok=0
              for i in $(seq 1 36); do
                s1="$(az provider show -n Microsoft.ContainerRegistry --query registrationState -o tsv 2>/dev/null)"
                s2="$(az provider show -n Microsoft.ContainerService --query registrationState -o tsv 2>/dev/null)"
                if [ "$s1" = "Registered" ] && [ "$s2" = "Registered" ]; then ok=1; break; fi
                echo "   waiting for provider registration... ($s1 / $s2)"
                sleep 10
              done
              [ "$ok" = "1" ] || { echo "##[error]resource providers not Registered after 6 min — see aka.ms/rps-not-found"; exit 1; }
              echo ">> providers registered"
              if az group show --name "$(RG)" >/dev/null 2>&1; then
                # Partial state check: RG exists -> ACR and AKS must exist too,
                # otherwise a previous apply failed midway. Fail loudly instead
                # of skipping and letting CD try to use a missing ACR.
                if az acr show --name "$(ACR_NAME)" --resource-group "$(RG)" >/dev/null 2>&1 \
                   && az aks show --name "$(AKS_NAME)" --resource-group "$(RG)" >/dev/null 2>&1; then
                  echo ">> RG '$(RG)' already exists with ACR + AKS — skipping Terraform (idempotent)"
                  exit 0
                fi
                echo "##[error]RG '$(RG)' exists but ACR '$(ACR_NAME)' and/or AKS '$(AKS_NAME)' are missing in it."
                echo "##[error]A previous apply failed midway. Check the portal, then either finish manually or"
                echo "##[error]delete the partial state: az group delete --name '$(RG)' --yes  (and re-run)."
                exit 1
              fi
              echo ">> ensure terraform CLI"
              terraform --version 2>/dev/null || {
                curl -fsSL "https://releases.hashicorp.com/terraform/1.9.5/terraform_1.9.5_linux_amd64.zip" -o /tmp/tf.zip
                # python -m zipfile extract does NOT preserve exec bits -> chmod 755
                ( cd /tmp && python3 -m zipfile -e tf.zip . \
                  && sudo cp terraform /usr/local/bin/ \
                  && sudo chmod 755 /usr/local/bin/terraform )
              }
              terraform version
              echo ">> terraform init + apply (infra/)"
              cd infra
              export ARM_CLIENT_ID="$(TFARM_CLIENT_ID)"
              export ARM_CLIENT_SECRET="$(TFARM_CLIENT_SECRET)"
              export ARM_TENANT_ID="$(TFARM_TENANT_ID)"
              export ARM_SUBSCRIPTION_ID="$(TFARM_SUB_ID)"
              export ARM_SKIP_PROVIDER_REGISTRATION=true
              terraform init
              terraform apply -auto-approve
              terraform output
            displayName: "Terraform: init + apply (azurerm via SP)"

  - stage: cd
    displayName: "CD - push ACR & deploy AKS"
    dependsOn:
      - ci
      - infra
    condition: succeeded()
    jobs:
      - job: deploy
        variables:
          - group: wallet-azure-vars
        steps:
          # Keep every `az` call inside ONE AzureCLI task: the CLI is
          # provisioned per-task, so later plain-script steps cannot use it.
          - task: AzureCLI@2
            displayName: "SP login, build & push to ACR, AKS credentials"
            inputs:
              azureSubscription: "wallet-azure"
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(System.DefaultWorkingDirectory)
              inlineScript: |
                set -eu
                az account show
                SHORT_SHA="$(git rev-parse --short HEAD)"
                TAG="sha-${SHORT_SHA}"
                IMG="$(ACR_LOGIN_SERVER)/wallet-api:${TAG}"
                echo ">> building $IMG"
                docker build -t "$IMG" .
                az acr update --name "$(ACR_NAME)" --admin-enabled true
                # az acr login = docker login against the registry
                az acr login --name "$(ACR_NAME)"
                docker push "$IMG"
                az aks get-credentials --name "$(AKS_NAME)" --resource-group "$(RG)"
                echo "##vso[task.setvariable variable=DEPLOY_IMAGE]$(ACR_NAME)/wallet-api:$TAG"

          - script: |
              set -eu
              echo ">> deploying $(DEPLOY_IMAGE) to $(AKS_NAME)"
              kubectl apply -k deploy/k8s
              # Consumer subscription can't do RBAC role assignments -> use the
              # ACR admin user as a docker-registry imagePullSecret (lab path).
              ACR_USER="$(az acr credential show --name "$(ACR_NAME)" --query adminUser -o tsv)"
              ACR_PW="$(az acr credential show --name "$(ACR_NAME)" --query 'passwords[0].value' -o tsv)"
              kubectl -n wallet-demo delete secret acr-credentials --ignore-not-found
              kubectl -n wallet-demo create secret docker-registry acr-credentials \
                --docker-server="$(ACR_LOGIN_SERVER)" \
                --docker-username="${ACR_USER}" \
                --docker-password="${ACR_PW}"
              kubectl -n wallet-demo patch deployment wallet-api --type merge \
                -p '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"acr-credentials"}]}}}}'
              kubectl -n wallet-demo set image deployment/wallet-api wallet-api="$(DEPLOY_IMAGE)"
              # lab convenience: expose envoy through a public Azure LoadBalancer
              kubectl -n wallet-demo patch svc envoy --type merge -p '{"spec":{"type":"LoadBalancer"}}'
              kubectl -n wallet-demo rollout status deployment/wallet-api --timeout=300s
              kubectl -n wallet-demo get pods -o wide
            displayName: "Apply manifests + set image + rollout"

          - script: |
              set -eu
              EXT_IP="$(kubectl -n wallet-demo get svc envoy -o jsonpath='{.status.loadBalancer.ingress[0].ip}')"
              if [ -z "$EXT_IP" ]; then
                echo "waiting for LoadBalancer IP allocation..."
                sleep 60
                EXT_IP="$(kubectl -n wallet-demo get svc envoy -o jsonpath='{.status.loadBalancer.ingress[0].ip}')"
                [ -n "$EXT_IP" ] || { echo "##[error]LoadBalancer IP not ready"; exit 1; }
              fi
              echo ">> envoy external IP: $EXT_IP"
              echo "==== smoke test ===="
              curl --fail --silent --show-error "http://$EXT_IP/healthz"
              echo
              curl --fail --silent --show-error "http://$EXT_IP/login" -o /dev/null -w "login page: HTTP %{http_code}\n"
            displayName: "Smoke test public endpoint"
