# Azure Pipelines — CI/CD for wallet-devops-lab
#
# Flow:  CI (gofmt, tidy, vet, race tests, docker build check)
#      -> CD (Azure SP login, build, push to ACR, deploy directly to AKS —
#         "lab mode" direct deploy, no Argo CD on AKS).
#
# Required in Azure DevOps (project settings):
#   1. ARM service connection named:  wallet-azure
#      (Authentication method: Service principal, role: Contributor on the
#       target subscription — ADO can create the SP for you in the wizard)
#   2. Variable group (Pipelines -> Libraries) named:  wallet-azure-vars
#        ACR_NAME          walletlab
#        ACR_LOGIN_SERVER  walletlab.azurecr.io
#        AKS_NAME          wallet-aks
#        RG                wallet-lab-rg
#
# Secrets: none stored in this repo — auth flows through the ARM service
# connection's Service Principal.

trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: ci
    displayName: "CI - test & verify"
    jobs:
      - job: test
        services:
          redis:
            image: redis:7-alpine
            ports:
              - "6379:6379"
        steps:
          - script: |
              set -eu
              wget -qO /tmp/go.tgz "https://go.dev/dl/go1.26.6.linux-amd64.tar.gz"
              sudo tar -C /usr/local -xzf /tmp/go.tgz
              export PATH=/usr/local/go/bin:$PATH
              go version
            displayName: "Install Go 1.26.6"

          - script: |
              set -eu
              export PATH=/usr/local/go/bin:$PATH
              go mod download
            displayName: "Download Go modules"

          - script: |
              set -eu
              export PATH=/usr/local/go/bin:$PATH
              unformatted="$(gofmt -l .)"
              if [ -n "$unformatted" ]; then
                echo "##[error]These files need gofmt:"
                echo "$unformatted"
                exit 1
              fi
            displayName: "Check gofmt"

          - script: |
              set -eu
              export PATH=/usr/local/go/bin:$PATH
              go mod tidy
              git diff --exit-code go.mod go.sum
            displayName: "Verify go.mod/go.sum tidy"

          - script: |
              set -eu
              export PATH=/usr/local/go/bin:$PATH
              go vet ./...
            displayName: "go vet"

          - script: |
              set -eu
              export PATH=/usr/local/go/bin:$PATH
              REDIS_TEST_ADDR=localhost:6379 go test -race ./...
            displayName: "go test -race (redis service)"

          - script: |
              set -eu
              docker build -t wallet-api:ci .
            displayName: "Validate Docker build"

  - stage: cd
    displayName: "CD - push ACR & deploy AKS"
    dependsOn:
      - ci
    condition: succeeded()
    jobs:
      - job: deploy
        variables:
          - group: wallet-azure-vars
        steps:
          # Keep every `az` call inside ONE AzureCLI task: the CLI is
          # provisioned per-task, so later plain-script steps cannot use it.
          - task: AzureCLI@2
            displayName: "SP login, build & push to ACR, AKS credentials"
            inputs:
              azureSubscription: "wallet-azure"
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(System.DefaultWorkingDirectory)
              inlineScript: |
                set -eu
                az account show
                SHORT_SHA="$(git rev-parse --short HEAD)"
                TAG="sha-${SHORT_SHA}"
                IMG="$(ACR_LOGIN_SERVER)/wallet-api:${TAG}"
                echo ">> building $IMG"
                docker build -t "$IMG" .
                az acr update --name "$(ACR_NAME)" --admin-enabled true
                # az acr login = docker login against the registry
                az acr login --name "$(ACR_NAME)"
                docker push "$IMG"
                az aks get-credentials --name "$(AKS_NAME)" --resource-group "$(RG)"
                echo "##vso[task.setvariable variable=DEPLOY_IMAGE]$(ACR_NAME)/wallet-api:$TAG"

          - script: |
              set -eu
              echo ">> deploying $(DEPLOY_IMAGE) to $(AKS_NAME)"
              kubectl apply -k deploy/k8s
              kubectl -n wallet-demo set image deployment/wallet-api wallet-api="$(DEPLOY_IMAGE)"
              # lab convenience: expose envoy through a public Azure LoadBalancer
              kubectl -n wallet-demo patch svc envoy --type merge -p '{"spec":{"type":"LoadBalancer"}}'
              kubectl -n wallet-demo rollout status deployment/wallet-api --timeout=300s
              kubectl -n wallet-demo get pods -o wide
            displayName: "Apply manifests + set image + rollout"

          - script: |
              set -eu
              EXT_IP="$(kubectl -n wallet-demo get svc envoy -o jsonpath='{.status.loadBalancer.ingress[0].ip}')"
              if [ -z "$EXT_IP" ]; then
                echo "waiting for LoadBalancer IP allocation..."
                sleep 60
                EXT_IP="$(kubectl -n wallet-demo get svc envoy -o jsonpath='{.status.loadBalancer.ingress[0].ip}')"
                [ -n "$EXT_IP" ] || { echo "##[error]LoadBalancer IP not ready"; exit 1; }
              fi
              echo ">> envoy external IP: $EXT_IP"
              echo "==== smoke test ===="
              curl --fail --silent --show-error "http://$EXT_IP/healthz"
              echo
              curl --fail --silent --show-error "http://$EXT_IP/login" -o /dev/null -w "login page: HTTP %{http_code}\n"
            displayName: "Smoke test public endpoint"
